name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # tests never launch Electron; the app job downloads it

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/gen-shell.mjs --check
      - name: Unit, integration and daemon tests (real PTYs, bash + zsh)
        run: npm test
      - name: UI end-to-end tests (headless Chromium)
        if: runner.os == 'Linux'
        run: |
          npx playwright@1.56.1 install --with-deps chromium
          export JAFFER_CHROME="$(find ~/.cache/ms-playwright -name chrome -path '*chromium-*' -type f | head -1)"
          npx vitest run --config vitest.e2e.config.ts
      - name: Upload UI screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/jaffer-shots
          if-no-files-found: ignore

  mac-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
      - name: Make both Mac architectures of the pty addon available (one runner builds arm64 and x64)
        run: |
          V=$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")
          npm install --no-save --force --no-audit --no-fund "@lydell/node-pty-darwin-arm64@$V" "@lydell/node-pty-darwin-x64@$V"
      - run: npm run build
      - name: Smoke test the real packaged app (Electron + daemon + shell + renderer)
        run: |
          npx electron-builder --dir --arm64 --publish never
          APP="release/mac-arm64/Jaffer.app"
          codesign -dv "$APP" 2>&1 | head -5 || true
          export JAFFER_HOME="$(mktemp -d)/jaffer-home"
          export JAFFER_SMOKE=1
          "$APP/Contents/MacOS/Jaffer" 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Package (dmg + zip, arm64 and x64)
        env:
          # Secrets are optional. They are copied into the variables electron-builder reads only when set:
          # an empty CSC_LINK is treated as a path and breaks the build.
          SECRET_CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          else
            echo "No signing certificate configured: building ad-hoc signed apps."
          fi
          if [ -n "$SECRET_APPLE_ID" ]; then
            export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            EXTRA="-c.mac.notarize=true"
          fi
          npx electron-builder --mac --arm64 --x64 --publish never $EXTRA
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: Jaffer-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jaffer-macOS
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
